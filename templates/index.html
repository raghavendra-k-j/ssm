<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Service Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts (Including JetBrains Mono) -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
  
  <!-- Boxicons -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  
  <style>
    body {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- App Bar -->
  <div class="bg-blue-600 text-white h-14 flex items-center px-6">
    <h1 class="text-xl font-semibold">🛠️ Service Manager</h1>
    <button id="addServiceBtn" class="ml-auto px-4 py-2 bg-blue-700 rounded hover:bg-blue-800 text-sm">
      ➕ Add New Service
    </button>
  </div>

  <!-- Add New Service Form -->
  <div id="addServiceForm" class="hidden p-6 bg-white shadow-lg rounded mt-6 mx-6">
    <h2 class="text-lg font-semibold mb-4">Add a New Service</h2>
    <form action="/add" method="POST" class="space-y-4">
      <input name="name" placeholder="Service Name" required class="p-2 w-full border rounded-md" />
      <input name="cmd" placeholder="Start Command" required class="p-2 w-full border rounded-md" />
      <input name="port" type="number" placeholder="Port" required class="p-2 w-full border rounded-md" />
      <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
        Add Service
      </button>
    </form>
  </div>

  <!-- Services List -->
  <div class="p-6">
    <h2 class="text-2xl font-semibold mb-4">Services</h2>
    {% for svc in services %}
    <div class="bg-white shadow rounded p-4 mb-4 flex justify-between items-center">
      <div>
        <h3 class="text-xl">{{ svc.name }}</h3>
        <p class="text-gray-600">{{ svc.cmd }}</p>
        <p>Port: {{ svc.port }}</p>
      </div>
      <div class="flex space-x-4">
        {% if svc.status == "Running" %}
          <span class="text-green-500">🟢 Running</span>
          <a href="/stop/{{ svc.index }}" class="text-red-600">
            <i class='bx bx-stop-circle text-2xl'></i>
          </a>
        {% else %}
          <span class="text-red-500">🔴 Stopped</span>
          <a href="/start/{{ svc.index }}" class="text-green-600">
            <i class='bx bx-play-circle text-2xl'></i>
          </a>
        {% endif %}
        <a href="/edit/{{ svc.index }}" class="text-blue-600">
          <i class='bx bx-edit text-2xl'></i>
        </a>
        <a href="/delete/{{ svc.index }}" class="text-gray-600">
          <i class='bx bx-trash text-2xl'></i>
        </a>
      </div>
    </div>
    {% endfor %}
  </div>

  <!-- Scripts to handle UI actions -->
  <script>
    document.getElementById('addServiceBtn').onclick = function() {
      document.getElementById('addServiceForm').classList.toggle('hidden');
    };
  </script>
</body>
</html>
